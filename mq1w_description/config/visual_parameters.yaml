# MQ1W appearance and collision geometry of each link.
#   materials  rgba
#   visual     STL meshes in meshes/visual/, coloured by `material`
#   collision  mesh: convex pieces in meshes/collision/, made from the link's visual meshes by
#              scripts/make_collision_meshes.py (it rewrites these lists and the MJCF geoms);
#              the contact elements keep their primitive: cylinder (wheel): radius, length (along z);
#              sphere (foot): radius
#   xyz, rpy   the pose in the link frame (m, rad); 0 when left out
# mjcf/mq1w.xml has the same collision geoms (scripts/validate_model.py mq1w counts them).
materials:
  white: [0.94, 0.94, 0.93, 1]
  dark: [0.16, 0.16, 0.18, 1]
  black: [0.05, 0.05, 0.07, 1]
  grey: [0.35, 0.36, 0.38, 1]
  led: [0.25, 0.85, 1, 1]
mesh_files:
  base:
    visual:
      - {mesh: shell_top.stl, material: white}
      - {mesh: shell_belly.stl, material: white}
      - {mesh: chest_dome.stl, material: white}
      - {mesh: rear_dome.stl, material: white}
      - {mesh: chest_led.stl, material: led}
      - {mesh: rear_led.stl, material: led}
      - {mesh: chest_camera.stl, material: black}
      - {mesh: chassis_frame.stl, material: dark}
      - {mesh: sensor_head.stl, material: white}
      - {mesh: face_visor.stl, material: black}
      - {mesh: lidar.stl, material: dark}
      - {mesh: go_m8010_6.stl, material: dark, xyz: [0.2, 0.05, 0], rpy: [0, 0, 1.5708]}
      - {mesh: go_m8010_6.stl, material: dark, xyz: [0.2, -0.05, 0], rpy: [3.14159, 0, -1.5708]}
      - {mesh: go_m8010_6.stl, material: dark, xyz: [-0.2, 0.05, 0], rpy: [-3.14159, 0, 1.5708]}
      - {mesh: go_m8010_6.stl, material: dark, xyz: [-0.2, -0.05, 0], rpy: [0, 0, -1.5708]}
    collision:
      - {mesh: base_0.stl}
      - {mesh: base_1.stl}
      - {mesh: base_2.stl}
      - {mesh: base_3.stl}
      - {mesh: base_4.stl}
      - {mesh: base_5.stl}
      - {mesh: base_6.stl}
      - {mesh: base_7.stl}
      - {mesh: base_8.stl}
      - {mesh: base_9.stl}
      - {mesh: base_10.stl}
      - {mesh: base_11.stl}
  FL_hip:
    visual:
      - {mesh: hip_bracket_fl.stl, material: dark}
      - {mesh: go_m8010_6.stl, material: dark, xyz: [0, 0.1, 0]}
      - {mesh: shoulder_pod_l.stl, material: white}
    collision:
